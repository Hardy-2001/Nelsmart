{% extends 'base.html' %}
{% load static %}

{% block content %}
<p style="color:red; font-size:14px;">* Indicates required field</p>
<div style="background:#f1f3f4; min-height:100vh; padding:40px 0;">

<div class="container" style="max-width:700px;">

    <!-- HEADER CARD -->
    <div style="background:white; border-top:8px solid #d93025; border-radius:10px; padding:25px; margin-bottom:20px;">
        <h2 style="margin-bottom:10px;">NELSMART Site Visit Request</h2>
        <p class="text-muted">Fill this form and we will contact you shortly</p>
    </div>

    <!-- LOGO CARD -->
    <div style="background:white; border-radius:10px; padding:30px; text-align:center; margin-bottom:20px;">
        <img src="{% static 'images/logo.png' %}" width="120">
    </div>

    <!-- FORM -->
    <form method="post">
        {% csrf_token %}

        <!-- NAME -->
        <div class="form-card">
            <label>Name *</label>
            <input type="text" name="name" required>
        </div>

        <!-- PHONE -->
        <div class="form-card">
            <label>Phone Number *</label>
            <input type="text" name="phone" required>
        </div>

        <!-- LOCATION -->
        <div class="form-card">
            <label>Location *</label>
            <input type="text" name="location" required>
        </div>
        <!-- SERVICES (CHECKBOXES) -->
    <div class="form-card">
        <label>What services are you looking for? *</label>

        <div class="checkbox-group">
            <label><input type="checkbox" name="services" value="Full solar"> Full solar</label>
            <label><input type="checkbox" name="services" value="Add solar to existing inverter"> Add solar to your existing inverter</label>
            <label><input type="checkbox" name="services" value="Inverter-only"> Inverter-only</label>
            <label><input type="checkbox" name="services" value="Battery replacement"> Battery replacement</label>
            <label><input type="checkbox" name="services" value="Troubleshoot system"> Troubleshoot existing system</label>
            <label><input type="checkbox" name="services" value="Energy audit"> Energy Audit</label>
        </div>

        <!-- MESSAGE -->
        <div class="form-card">
            <label>Additional Details</label>
            <textarea name="message"></textarea>
        </div>

        <!-- BUTTON -->
        <button class="submit-btn">
            Submit Request
        </button>
    </div>
    </form>

</div>
</div>



{% endblock %}
