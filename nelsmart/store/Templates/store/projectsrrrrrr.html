{% extends 'base.html' %}
{% block content %}

<h2 class="text-center mb-4">Our Recent Projects</h2>

<div class="row">
    {% for project in projects %}
    <div class="col-md-4 mb-4">
        <div class="card shadow-sm">

            <img src="{{ project.main_image.url }}" class="card-img-top" style="height:250px; object-fit:cover;">

            <div class="card-body">
                <h5>{{ project.title }}</h5>

                <a href="{% url 'project_detail' project.id %}" class="btn btn-warning">
                    View More
                </a>
            </div>

        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
